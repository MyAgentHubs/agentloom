[package]
name = "agentloom"
version = "0.1.0"
description = "AgentLoom is an open-source desktop workbench that turns many LLMs into one workforce you control."
authors = ["MyAgentHubs <panda@myagenthubs.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/MyAgentHubs/agentloom"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tiny_http = "0.12"
reqwest = { version = "0.13", features = ["blocking"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
ignore = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSResponder",
    "NSAttributedString",
    "NSColor",
    "NSFont",
    "NSParagraphStyle",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSObject",
    "NSAttributedString",
    "NSDictionary",
    "NSString",
] }

[dev-dependencies]
tempfile = "3"
