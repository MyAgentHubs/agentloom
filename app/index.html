<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/agentloom-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentLoom</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f2ec;
      }

      .al-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f5f2ec;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          sans-serif;
        transition: opacity 0.22s ease;
      }

      .al-boot__mark {
        color: #3a3833;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.12em;
      }

      .al-boot__bar {
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e0d6;
      }

      .al-boot__bar-fill {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #d97757;
        animation: al-boot-slide 1.1s ease-in-out infinite alternate;
      }

      .al-boot--done {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes al-boot-slide {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(150%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .al-boot__bar-fill {
          width: 100%;
          opacity: 0.45;
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div
      id="al-boot"
      class="al-boot"
      role="status"
      aria-label="AgentLoom is starting"
    >
      <div class="al-boot__mark">AgentLoom</div>
      <div class="al-boot__bar"><div class="al-boot__bar-fill"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
