name: Full test gates

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.97.0'

jobs:
  engine-tests:
    name: Engine (myagent) tests
    runs-on: ${{ github.repository == 'MyAgentHubs/agentloom-internal' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    defaults:
      run:
        working-directory: harness-agent
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness-agent
      - run: cargo fmt --check
      # --locked also compiles and runs tests/, so this alone covers unit + integration.
      - run: cargo test -p myagent --locked
      - name: Build with zero compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p myagent --locked 2>&1 | tee /tmp/engine-build.log
          warning_count="$(grep -c '^warning' /tmp/engine-build.log || true)"
          echo "warning count: ${warning_count:-0}"
          if [[ "${warning_count:-0}" -ne 0 ]]; then
            echo "ERROR: engine build produced ${warning_count} warning(s)" >&2
            exit 1
          fi
      - run: cargo test -p myagent --test file_size_ratchet --locked

  app-rust-tests:
    name: App backend (Rust)
    # macos-14, not ubuntu: macos-compat-smoke.yml already proves the app crate
    # compiles on macos-14; nothing has verified it on Linux (missing Tauri system
    # deps), so this gate doesn't gamble on that yet.
    runs-on: ${{ github.repository == 'MyAgentHubs/agentloom-internal' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            harness-agent
      - run: cargo fmt --check
      # A fresh checkout has no myagent sidecar; tauri's build script requires it
      # at binaries/myagent-<host-triple> before anything in src-tauri compiles,
      # regardless of --no-default-features.
      - name: Stage myagent sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path ../../harness-agent/Cargo.toml -p myagent
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          cp "../../harness-agent/target/release/myagent" "binaries/myagent-${triple}"
      - name: Build with zero compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          cargo build --no-default-features --locked 2>&1 | tee /tmp/app-build.log
          warning_count="$(grep -c '^warning' /tmp/app-build.log || true)"
          echo "warning count: ${warning_count:-0}"
          if [[ "${warning_count:-0}" -ne 0 ]]; then
            echo "ERROR: app backend build produced ${warning_count} warning(s)" >&2
            exit 1
          fi
      - run: cargo test --lib --no-default-features --locked
      # --no-run also compiles tests/, which --lib silently skips.
      - run: cargo test --no-run --no-default-features --locked

  frontend:
    name: Frontend (typecheck / test / format)
    runs-on: ${{ github.repository == 'MyAgentHubs/agentloom-internal' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  remote-web-build:
    name: remote-web build
    runs-on: ${{ github.repository == 'MyAgentHubs/agentloom-internal' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: remote-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            remote-web/package-lock.json
      - name: Install app dependencies (remote-web resolves @app imports against app/node_modules)
        working-directory: app
        run: npm ci
      - run: npm ci
      - run: npm run build
      # Relay tests need no install (Node built-ins only), but security-headers.test.js
      # hashes the inline script in remote-web/dist/index.html, so they run after the build.
      - name: remote-relay tests
        working-directory: remote-relay
        run: npm test
