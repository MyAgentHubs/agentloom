# Public-repo CI. Deliberately minimal: it must run green on a fork with zero
# secrets configured. Signing, notarization, and store-packaging scripts ship
# in this repository, but CI does not run them because they require secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-size-gate:
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ steps.pin.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
      # No candidate application code, tests or npm lifecycle runs before this
      # gate. The checker and this workflow are themselves reviewable policy.
      - name: Fetch and pin file size baseline
        id: pin
        env:
          SIZE_GATE_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A push can contain multiple commits: HEAD^ would miss earlier growth.
            # Never compare a main push to the just-pushed origin/main.
            if [[ ! "$SIZE_GATE_BEFORE" =~ ^[0-9a-f]{40}$ || "$SIZE_GATE_BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              echo "ERROR: no pre-push baseline; first import requires a reviewed baseline, never HEAD or skip." >&2
              exit 1
            fi
            git fetch --no-tags origin "$SIZE_GATE_BEFORE"
            git rev-parse --verify "${SIZE_GATE_BEFORE}^{commit}"
            git update-ref refs/remotes/origin/main "$SIZE_GATE_BEFORE"
          fi
          echo "baseline=$(git rev-parse 'refs/remotes/origin/main^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Check file sizes before candidate execution
        # -I prevents candidate Python modules / sitecustomize from shadowing stdlib.
        run: python3 -I scripts/check_file_size.py
      - name: Test gate regressions
        run: python3 -I scripts/test_file_size_gate.py

  frontend:
    needs: file-size-gate
    name: Frontend (typecheck / test / format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned file size baseline
        env:
          SIZE_GATE_BASELINE: ${{ needs.file-size-gate.outputs.baseline }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SIZE_GATE_BASELINE"
          git update-ref refs/remotes/origin/main "$SIZE_GATE_BASELINE"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  engine:
    needs: file-size-gate
    name: Engine (myagent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness-agent
      - run: cargo fmt --check
      # --no-fail-fast: without it cargo stops at the first test binary that
      # fails, and every later failure stays hidden until that one is fixed.
      - run: cargo test --locked --no-fail-fast

  app-backend:
    needs: file-size-gate
    name: App backend (Rust)
    # macOS on purpose, not for cost: parts of the backend test suite exercise
    # macOS-only facilities (`/usr/bin/sandbox-exec` for the verifier sandbox,
    # `/bin/ps` for descendant-process checks). Roughly 20 tests across
    # `worktree::`, `checkpoint_hook::` and `proc::` cannot pass on Linux.
    # Do not "save minutes" by moving this to ubuntu-latest.
    runs-on: macos-latest
    env:
      # bridge_eval spawn scenarios need to launch a real engine process.
      MYAGENT_BIN: ${{ github.workspace }}/harness-agent/target/release/myagent
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned file size baseline
        env:
          SIZE_GATE_BASELINE: ${{ needs.file-size-gate.outputs.baseline }}
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SIZE_GATE_BASELINE"
          git update-ref refs/remotes/origin/main "$SIZE_GATE_BASELINE"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            harness-agent
      - run: cargo fmt --check
      # A fresh checkout has no myagent sidecar; tauri's build script requires it
      # at binaries/myagent-<host-triple> before anything in src-tauri compiles.
      - name: Stage myagent sidecar
        run: |
          cargo build --release --locked --manifest-path ../../harness-agent/Cargo.toml
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          cp "../../harness-agent/target/release/myagent" "binaries/myagent-${triple}"
      # --no-run also compiles tests/, which --lib silently skips.
      - run: cargo test --no-run --locked
      # --no-fail-fast: without it cargo stops at the first test binary that
      # fails, and every later failure stays hidden until that one is fixed.
      - run: cargo test --locked --no-fail-fast

  windows-check:
    needs: file-size-gate
    name: App backend compiles on Windows
    # Type-check only, and deliberately not the test suite: a large share of the
    # backend tests use Unix-only facilities on purpose. What this job protects is
    # narrower and was worth a whole broken release build to learn — a single
    # unguarded `use std::os::unix::...` in shipping code silently makes the app
    # impossible to build on Windows at all, and nothing else in CI notices.
    # Cross-checking this from a Mac is not an option: the dependency tree pulls
    # aws-lc-sys, whose build script needs a C toolchain targeting Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            harness-agent
      # Same reason as the macOS job: tauri's build script resolves the sidecar
      # before src-tauri compiles. Windows adds the .exe suffix on both ends.
      - name: Stage myagent sidecar
        shell: bash
        run: |
          cargo build --release --locked --manifest-path ../../harness-agent/Cargo.toml
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p binaries
          cp "../../harness-agent/target/release/myagent.exe" "binaries/myagent-${triple}.exe"
      - run: cargo check --locked
